[project]
name = "ya-django-toolkit-jp"
description = "日本語（マルチバイト文字）の考慮も入れた Django プロジェクトのためのユーティリティです。"
authors = [
    { name = "yk-lab a.k.a YetAnother_yk", email = "yk-lab@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "django>=4.2,<5.0",
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yk-lab"
Repository = "https://github.com/yk-lab/ya-django-toolkit-jp"
Documentation = "https://github.com/yk-lab/ya-django-toolkit-jp"

# オプション依存（コアは Django のみで動作する）。
# ULID は推奨の保守版 python-ulid を `[all]` に入れる。コードは ulid-py も
# 後方互換で受け付けるため、既存ユーザーがそのまま ulid-py を継続使用しても動作する。
[project.optional-dependencies]
all = [
    "python-ulid>=3.0,<4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.3,<5.0",  # pre-commit-uv>=4.2 が pre-commit>=4.3 を要求するため
    "pre-commit-uv>=4.2",  # pre-commit のフック env を uv で構築（高速化 + wheel 取り扱いの堅牢化）
    "types-backports>=0.1.3,<0.2.0",
    "django-types>=0.17.0,<0.18.0",
    "mypy>=1.3.0,<2.0",
    "coverage>=7.2.5,<8.0",
    "poethepoet>=0.29",
]

# タスクランナー（旧 taskipy 相当）。`uv run poe <task>` で実行。
[tool.poe.tasks]
test = "coverage run --source ./ya_django_toolkit_jp/ -m unittest discover ./tests/"
lint = "ruff check"
generate_changelog = { shell = "GITHUB_TOKEN=$(gh auth token) gh2changelog" }

# Lint 統合（flake8 / isort / autopep8 を置換）。
# 整形（クォート統一）は #21 で `[tool.ruff.format]` を別途追加予定。
# 旧 flake8 の line-length=79 を緩和して 100 に。日本語コメント/文字列が多く、
# 旧コードに散在していた `# noqa: E501` 回避が不要になる。
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]

# 整形（旧 autopep8 + double-quote-string-fixer の置き換え）。
# 旧 single quote 強制を撤回し、ruff / Black エコシステム標準のダブルクォートに統一する。
# `line-length` は [tool.ruff] を継承（=100）。
[tool.ruff.format]
quote-style = "double"

# git タグからの動的バージョニング（旧 poetry-git-version-plugin 相当）。
# タグ上は素のバージョン、未タグ build は {base}.pre{distance}（PEP 440 プレリリース）。
[tool.hatch.version]
source = "uv-dynamic-versioning"

# style は明示しない（custom format-jinja を検証させず、hatchling 側で PEP 440 正規化する）。
# style = "pep440" を付けると `0.0.3.pre1` が厳格検証で弾かれ、未タグ build が失敗するため。
[tool.uv-dynamic-versioning]
vcs = "git"
format-jinja = "{% if distance == 0 %}{{ base }}{% else %}{{ base }}.pre{{ distance }}{% endif %}"

[tool.hatch.build.targets.wheel]
packages = ["ya_django_toolkit_jp"]

[tool.hatch.build.targets.sdist]
include = [
    "/ya_django_toolkit_jp",
    "/CHANGELOG.md",
    "/README.md",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
