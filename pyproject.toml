[project]
name = "ya-django-toolkit-jp"
description = "日本語（マルチバイト文字）の考慮も入れた Django プロジェクトのためのユーティリティです。"
authors = [
    { name = "yk-lab a.k.a YetAnother_yk", email = "yk-lab@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "django>=4.2,<5.0",
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yk-lab"
Repository = "https://github.com/yk-lab/ya-django-toolkit-jp"
Documentation = "https://github.com/yk-lab/ya-django-toolkit-jp"

# オプション依存（コアは Django のみで動作する）。
# ULID は推奨の保守版 python-ulid を `[all]` に入れる。コードは ulid-py も
# 後方互換で受け付けるため、既存ユーザーがそのまま ulid-py を継続使用しても動作する。
# ※ django-boost は #15 でインライン撤廃予定。
[project.optional-dependencies]
all = [
    "python-ulid>=3.0,<4.0",
    "django-boost>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0,<7.0",
    "isort>=5.12.0,<6.0",
    "flake8-isort>=6.0.0,<7.0",
    "autopep8>=2.0.2,<3.0",
    "pre-commit>=3.3.2,<4.0",
    "types-backports>=0.1.3,<0.2.0",
    "django-types>=0.17.0,<0.18.0",
    "mypy>=1.3.0,<2.0",
    "coverage>=7.2.5,<8.0",
    "poethepoet>=0.29",
]

# タスクランナー（旧 taskipy 相当）。`uv run poe <task>` で実行。
[tool.poe.tasks]
test = "coverage run --source ./ya_django_toolkit_jp/ -m unittest discover ./tests/"
generate_changelog = { shell = "GITHUB_TOKEN=$(gh auth token) gh2changelog" }

# git タグからの動的バージョニング（旧 poetry-git-version-plugin 相当）。
# タグ上は素のバージョン、未タグ build は {base}.pre{distance}（PEP 440 プレリリース）。
[tool.hatch.version]
source = "uv-dynamic-versioning"

# style は明示しない（custom format-jinja を検証させず、hatchling 側で PEP 440 正規化する）。
# style = "pep440" を付けると `0.0.3.pre1` が厳格検証で弾かれ、未タグ build が失敗するため。
[tool.uv-dynamic-versioning]
vcs = "git"
format-jinja = "{% if distance == 0 %}{{ base }}{% else %}{{ base }}.pre{{ distance }}{% endif %}"

[tool.hatch.build.targets.wheel]
packages = ["ya_django_toolkit_jp"]

[tool.hatch.build.targets.sdist]
include = [
    "/ya_django_toolkit_jp",
    "/CHANGELOG.md",
    "/README.md",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
